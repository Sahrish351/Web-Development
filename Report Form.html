<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
            font-size: 30px;
        }
        table {
            margin: auto;
            border-collapse: collapse;
            background: white;
            width: 50%;
            border: 1px solid black;
            
        }
        td {
            border: 1px solid grey;
            padding: 10px;
        }
        .info {
            border: 1px solid grey;
            padding: 10px;
            background: grey;
            color: white;
            font-size: 30px;
        }
        input, select, textarea {
            width: 95%;
            padding: 5px;
        }
        input[type="checkbox"],
        input[type="radio"] {
            width: auto;
            vertical-align: middle;
        }
        .report {
            font-size: 30px;
    
        }
        td:first-child {
            text-align: center;
        }

    </style>
</head>
<body>
    
    <form>
        <table>
            <tr class="report">
                <th colspan="2">REPORT FORM</th>
            </tr>
            <tr class="info">
                <th colspan="2">INFORMATION TABLE</th>
            </tr>
            <tr>
                <td><label for="name">NAME</label></td>
                <td><input type="text" id="name" name="name" placeholder="Enter Your Name" required></td>
            </tr>
        
            <tr>
                <td><label for="email">EMAIL</label></td>
                <td><input type="email" id="email" name="email" placeholder="Enter Your Email" required></td>
            </tr>

            <tr>
                <td><label for="password">PASSWORD</label></td>
                <td><input type="password" id="password" name="password" placeholder="Enter Your Password" required></td>
            </tr>

            <tr>
                <td><label for="address">ADDRESS</label></td>
                <td><input type="text" id="address" name="address" placeholder="Enter Address" required></td>
            </tr>

            <tr>
                <td><label for="country">COUNTRY</label></td>
                <td><select id="country" name="country">
                    <option value="Pakistan">Pakistan</option>
                    <option value="India">India</option>
                    <option value="China">China</option>
                    <option value="USA">USA</option>
                    <option value="London">London</option>
                </select></td>
            </tr>

            <tr>
                <td>GENDER</td>
                <td><label for="male">Male</label>
                    <input type="radio" id="male" name="gender">
                    <label for="female">Female</label>
                    <input type="radio" id="female" name="gender">
                </td>
            </tr>
            
            <tr>
                <td>HOBBIES</td>
                <td><input type="checkbox" id="reading" name="hobbies" value="Reading">
                    <label for="reading">Reading</label><br>

                    <input type="checkbox" id="listening music" name="hobbies" value="Listening music">
                    <label for="listening music">Listening music</label><br>

                    <input type="checkbox" id="gardening" name="hobbies" value="Gardening">
                    <label for="gardening">Gardening</label><br>
                    
                    <input type="checkbox" id="swimming" name="hobbies" value="Swimming">
                    <label for="swimming">Swimming</label><br>
                    
                    <input type="checkbox" id="atheletics" name="hobbies" value="Atheletice">
                    <label for="atheletics">Atheletics</label><br>
                    
                </td>
            </tr>

            <tr>
                <td><label for="website-link">YOUR WEBSITE</label></td>
                <td><input type="url" id="website-link" name="website" placeholder="Provide Your website URL if Exists(Not Necessary)"></td>
            </tr>

            <tr>
                <td><label>OTHER INFORMATION ABOUT YOU</label></td>
                <td><textarea rows="4" placeholder="Write any other Information that is not present here" required></textarea></td>
            </tr>

            <tr>
                <td style="text-align: center;"><button type="submit">SEND IN MY REPORT</button></td>
                <td style="text-align: center;"><button type="reset">ERASE REPORT FORM</button></td>
            </tr>
        </table>

    </form>
</body>
</html>
